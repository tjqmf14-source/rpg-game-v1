name: Windows Playtest Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "quality/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Export Windows playtest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Runtime smoke test
        run: godot --headless --path . res://tests/smoke_runner.tscn

      - name: Data integrity test
        run: godot --headless --path . --script res://tests/data_integrity_test.gd

      - name: Gameplay regression test
        run: godot --headless --path . res://tests/gameplay_regression_runner.tscn

      - name: Combat runtime test
        run: godot --headless --path . res://tests/combat_runtime_runner.tscn

      - name: Export Windows release
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/RelicBound.exe

      - name: Verify Windows build
        run: |
          test -f build/windows/RelicBound.exe
          test -f build/windows/RelicBound.pck

      - name: Upload playtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: RELIC-BOUND-Windows-Playtest
          path: build/windows/
          if-no-files-found: error
          retention-days: 14
