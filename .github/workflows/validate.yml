name: Godot Validation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "quality/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Godot 4.7.2 quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Smoke test
        run: godot --headless --path . res://tests/smoke_runner.tscn

      - name: Data integrity test
        run: godot --headless --path . --script res://tests/data_integrity_test.gd

      - name: Gameplay regression test
        run: godot --headless --path . res://tests/gameplay_regression_runner.tscn
